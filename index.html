  <style>
:root{color-scheme:dark;--text:#f9fffd;--muted:#afc4bd}
*{box-sizing:border-box}
html{min-width:320px;min-height:100%;background:#000}
body{
  margin:0;min-height:100vh;min-height:100svh;overflow-x:hidden;
  background:#000;color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-feature-settings:"tnum" 1
}
.screen{
  min-height:100vh;min-height:100svh;padding:clamp(12px,3vw,36px);
  display:flex;align-items:center;justify-content:center;background:#000
}
.timer-shell{
  width:min(1250px,100%);padding:0;background:transparent;
  border:0;outline:0;border-radius:0;box-shadow:none
}
.timer-shell::before,.timer-shell::after{content:none;display:none}
.grid{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  align-items:start;gap:clamp(11px,1.5vw,22px)
}
.unit{
  min-width:0;margin:0;padding:0;display:flex;align-items:center;
  flex-direction:column;justify-content:flex-start;gap:clamp(11px,1.2vw,18px);
  background:transparent;border:none;border-radius:0;box-shadow:none
}
.unit::before,.unit::after{content:none!important;display:none!important}
.dial{
  --on:#36ffb3;--off:#16372d;--glow:rgba(32,255,172,.24);
  flex-shrink:0;position:relative;isolation:isolate;
  display:grid;place-items:center;width:min(100%,164px);
  aspect-ratio:1;border-radius:50%;background:#000;box-shadow:none;
  transition:filter .55s ease
}
.dial.warn{--on:#ffd047;--off:#403315;--glow:rgba(255,204,56,.24)}
.dial.danger{--on:#ff504a;--off:#41201d;--glow:rgba(255,72,64,.24)}
/* Sixty real SVG tick lines, with longer marks each fifth second.
   The active segment illuminates one tick at a time, rather than a pie-shaped arc. */
.tick-ring{
  position:absolute;inset:0;z-index:0;
  width:100%;height:100%;overflow:visible;
  pointer-events:none;filter:drop-shadow(0 0 2px var(--glow));
  transition:filter .6s ease
}
.tick-mark{
  stroke:var(--off);stroke-width:3.1;stroke-linecap:round;
  vector-effect:non-scaling-stroke;
  opacity:.86;
  transition:stroke .5s cubic-bezier(.2,.73,.22,1),opacity .5s ease
}
.tick-mark.major{stroke-width:3.7}
.tick-mark.active{stroke:var(--on);opacity:1}
.dial::before,.dial::after,.shine{display:none!important;content:none}
.value{
  position:relative;z-index:2;display:inline-flex;
  width:100%;height:1.19em;justify-content:center;align-items:center;
  gap:0;color:#f8fffd;
  font-family:"Barlow Condensed","SF Compact Display","Arial Narrow",sans-serif;
  font-size:clamp(62px,6.65vw,100px);font-weight:500;
  line-height:1;letter-spacing:0;font-stretch:condensed;
  font-feature-settings:"tnum" 1,"lnum" 1;
  font-variant-numeric:tabular-nums lining-nums;
  transform:scaleX(.84);text-shadow:none;backface-visibility:hidden
}
.digit-window{
  position:relative;display:inline-block;flex:0 0 .53em;
  width:.53em;height:1.1em;overflow:hidden
}
.digit-face{
  position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;
  line-height:1;color:#f8fffd;
  font-variant-numeric:tabular-nums;
  backface-visibility:hidden
}
.label{
  font-size:clamp(9px,.9vw,12px);font-weight:710;
  line-height:1.35;letter-spacing:.13em;
  color:var(--muted);text-align:center;
  white-space:nowrap;user-select:none
}
.sr-only{
  position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0
}
@media(max-width:1080px){
  .dial{width:min(100%,136px)}
  .value{font-size:clamp(50px,5.8vw,82px)}
}
@media(max-width:830px){
  .timer-shell{max-width:570px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:27px 13px}
  .unit{gap:12px}
  .dial{width:min(93%,148px)}
  .value{font-size:clamp(56px,10.9vw,88px)}
  .label{font-size:clamp(9px,1.8vw,11px)}
}
@media(max-width:480px){
  .screen{padding:12px}
  .grid{gap:24px 9px}
  .unit{gap:10px}
  .dial{width:min(96%,120px)}
  .value{font-size:clamp(46px,14vw,70px)}
  .label{font-size:clamp(8px,2.4vw,10px);letter-spacing:.07em}
}
@media(max-width:350px){
  .screen{padding:8px}
  .grid{gap:22px 6px}
  .value{font-size:45px}
  .label{font-size:8px;letter-spacing:0}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* SVG lettering closely follows the tall, fine, rounded watch numerals in the reference. */
.value {
  display:inline-flex;
  justify-content:center;
  align-items:center;
  width:100%;
  height:1em;
  font-size:clamp(70px,7.6vw,99px);
  font-family:inherit;
  font-weight:400;
  font-variant-numeric:tabular-nums;
  transform:none;
  gap:0;
  white-space:nowrap;
  color:#f8fffd;
}
.digit-window {
  position:relative;
  display:block;
  flex:0 0 .375em;
  width:.375em;
  height:1em;
  overflow:hidden;
}
.digit-face {
  display:block;
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  color:#f6f7f7;
  overflow:visible;
  backface-visibility:hidden;
  will-change:transform,opacity;
}
@media(max-width:1080px) {
  .value {font-size:clamp(55px,6.75vw,82px)}
}
@media(max-width:830px) {
  .value {font-size:clamp(65px,12.5vw,91px)}
}
@media(max-width:480px) {
  .value {font-size:clamp(53px,14.4vw,73px)}
}
@media(max-width:350px) {
  .value {font-size:52px}
}


/* Motivational quote: closer to the countdown, bright crisp Tahoma on pure black. */
.screen {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(48px,8vh,82px);
}
.timer-shell {
  flex:0 0 auto;
  margin:0;
}
.quote-footer {
  flex:0 0 auto;
  width:100%;
  max-width:1140px;
  padding:0 12px;
  margin:0;
  text-align:center;
  background:transparent;
  border:0;
}
.quote-footer p {
  margin:0;
  color:#ffffff;
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;
  font-size:clamp(18px,1.9vw,24px);
  font-weight:400;
  line-height:1.85;
  letter-spacing:0;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  text-shadow:
    0 0 3px rgba(255,255,255,.42),
    0 0 11px rgba(255,255,255,.46),
    0 0 26px rgba(255,255,255,.20);
  text-wrap:balance;
}
@media(max-width:600px) {
  .screen {gap:clamp(38px,6vh,54px)}
  .quote-footer {padding:0 9px}
  .quote-footer p {font-size:clamp(16px,4.35vw,20px);line-height:1.8}
}
@media(max-height:460px) and (min-width:650px){
  .screen {gap:25px}
  .quote-footer p {font-size:16px}
}

/* Rotating time quotes: smooth optical light pulse on the black background. */
.quote-footer {min-height:clamp(76px,9vh,108px);display:grid;place-items:center}
.quote-footer p {
  opacity:1;
  transition:opacity .4s ease, transform .4s cubic-bezier(.22,.75,.3,1),filter .4s ease;
}
.quote-footer p.quote-exit {
  opacity:0;transform:translateY(-7px) scale(.987);filter:blur(3px);
}
.quote-footer p.quote-arrive {
  animation:mx-quote-glow .95s cubic-bezier(.2,.7,.25,1) both;
}
@keyframes mx-quote-glow {
  0% {opacity:0;transform:translateY(8px) scale(.985);filter:blur(4px);text-shadow:0 0 0 transparent}
  46% {opacity:1;transform:translateY(-1px);filter:blur(0);text-shadow:0 0 7px rgba(255,255,255,.75),0 0 20px rgba(255,255,255,.5),0 0 34px rgba(255,255,255,.24)}
  100% {opacity:1;transform:none;filter:blur(0);text-shadow:0 0 3px rgba(255,255,255,.42),0 0 11px rgba(255,255,255,.46),0 0 26px rgba(255,255,255,.2)}
}
@media(max-width:600px){.quote-footer{min-height:88px}}
@media(prefers-reduced-motion:reduce){
  .quote-footer p{transition:none!important}
  .quote-footer p.quote-exit{opacity:1;transform:none;filter:none}
  .quote-footer p.quote-arrive{animation:none!important}
}

</style>

<body>
<div class="screen">
  <main class="timer-shell" aria-label="Live countdown to March 4, 2027">
    <section class="grid" id="timer" role="timer" aria-live="off"><div class="unit"><div class="dial"><span id="months" class="value">--</span></div><span class="label">MONTHS</span></div>
<div class="unit"><div class="dial"><span id="weeks" class="value">--</span></div><span class="label">WEEKS</span></div>
<div class="unit"><div class="dial"><span id="days" class="value">--</span></div><span class="label">DAYS</span></div>
<div class="unit"><div class="dial"><span id="hours" class="value">--</span></div><span class="label">HOURS</span></div>
<div class="unit"><div class="dial"><span id="minutes" class="value">--</span></div><span class="label">MINUTES</span></div>
<div class="unit"><div class="dial"><span id="seconds" class="value">--</span></div><span class="label">SECONDS</span></div></section>
  </main>
  <footer class="quote-footer" lang="ar" dir="rtl"><p id="daily-quote">كل دقيقة تأجل بيها حياتك، هي دقيقة مستحيل ترجع.</p></footer>
</div>
<div class="sr-only" id="screenreader" aria-live="polite" aria-atomic="true"></div>
<script>
    (function () {
      "use strict";
      // March 4, 2027 at 00:00 Baghdad time (Asia/Baghdad, UTC+03).
      // An explicit UTC instant means all devices count down to the SAME moment.
      const TARGET = Date.parse("2027-03-03T21:00:00Z");
      const BAGHDAD_OFFSET_MS = 3 * 60 * 60 * 1000;
      const formatter = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Baghdad", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
      });
      const ids = ["months", "weeks", "days", "hours", "minutes", "seconds"];
      const nodes = Object.fromEntries(ids.map(function(id) { return [id, document.getElementById(id)]; }));
      const screenreader = document.getElementById("screenreader");
      let lastAnnouncement = -1;
      let completed = false;

      function partsAt(instant) {
        const parts = {};
        formatter.formatToParts(new Date(instant)).forEach(function(part) {
          if (part.type !== "literal") parts[part.type] = Number(part.value);
        });
        return parts;
      }

      function plusMonths(original, count) {
        const index = original.year * 12 + original.month - 1 + count;
        const year = Math.floor(index / 12);
        const month = index - year * 12 + 1;
        const maxDay = new Date(Date.UTC(year, month, 0)).getUTCDate();
        return {
          year: year, month: month, day: Math.min(original.day, maxDay),
          hour: original.hour, minute: original.minute, second: original.second
        };
      }

      function baghdadInstant(parts) {
        return Date.UTC(parts.year, parts.month - 1, parts.day,
          parts.hour, parts.minute, parts.second) - BAGHDAD_OFFSET_MS;
      }

      function breakdown(now) {
        if (now >= TARGET) return [0, 0, 0, 0, 0, 0];
        const localNow = partsAt(now);
        let months = Math.max(0, (2027 - localNow.year) * 12 + (3 - localNow.month));
        while (months > 0 && baghdadInstant(plusMonths(localNow, months)) > TARGET) months--;
        while (baghdadInstant(plusMonths(localNow, months + 1)) <= TARGET) months++;
        let remainingSeconds = Math.floor((TARGET - baghdadInstant(plusMonths(localNow, months))) / 1000);
        const weeks = Math.floor(remainingSeconds / 604800); remainingSeconds %= 604800;
        const days = Math.floor(remainingSeconds / 86400); remainingSeconds %= 86400;
        const hours = Math.floor(remainingSeconds / 3600); remainingSeconds %= 3600;
        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = remainingSeconds % 60;
        return [months, weeks, days, hours, minutes, seconds];
      }

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      // Custom resolution-independent watch-face glyphs: tall, narrow strokes.
      // SVG outlines make the silhouette consistent on iPhone, desktop and retina screens.
      const numeralPaths = {"0":"M24 8 C13 8 9 20 9 36 V92 C9 111 14 120 24 120 C34 120 39 111 39 92 V36 C39 20 35 8 24 8 Z","1":"M9 24 L24 9 V119","2":"M9 34 C9 17 14 8 24 8 C35 8 40 18 40 34 C40 48 34 57 25 70 L9 119 H41","3":"M9 20 C13 12 18 8 25 8 C35 8 40 18 40 33 C40 50 34 60 23 62 C35 63 41 74 41 91 C41 111 35 120 24 120 C14 120 9 111 8 103","4":"M36 119 V8 L7 86 H43","5":"M40 9 H13 L10 59 C15 54 21 51 27 53 C37 56 41 70 41 89 C41 110 35 120 24 120 C14 120 9 112 8 103","6":"M39 18 C35 11 31 8 24 8 C12 8 8 23 8 42 V89 C8 109 13 120 24 120 C35 120 40 108 40 90 C40 73 35 64 24 64 C13 64 8 75 8 90","7":"M7 9 H42 L17 119","8":"M24 8 C13 8 9 18 9 34 C9 50 14 60 24 60 C34 60 39 50 39 34 C39 18 35 8 24 8 Z M24 60 C12 60 8 72 8 89 C8 109 13 120 24 120 C35 120 40 109 40 89 C40 72 36 60 24 60 Z","9":"M40 43 C40 23 35 8 24 8 C13 8 8 20 8 39 C8 58 13 68 24 68 C35 68 40 58 40 43 V89 C40 109 35 120 24 120 C17 120 12 116 9 109"};
      function newGlyph(char) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 48 128");
        svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        svg.setAttribute("class", "digit-face");
        svg.setAttribute("aria-hidden", "true");
        svg.setAttribute("focusable", "false");
        svg.dataset.digit = char;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", numeralPaths[char] || numeralPaths["0"]);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "currentColor");
        path.setAttribute("stroke-width", "8.7");
        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("stroke-linejoin", "round");
        svg.appendChild(path);
        return svg;
      }
      function setNumber(node, number) {
        const text = String(number).padStart(2, "0");
        if (node.dataset.number === text) return;
        const firstRender = !node.dataset.number;
        node.dataset.number = text;
        node.setAttribute("aria-label", text);
        if (firstRender) {
          node.textContent = "";
          for (const char of text) {
            const win = document.createElement("span");
            win.className = "digit-window";
            win.dataset.digit = char;
            win.appendChild(newGlyph(char));
            node.appendChild(win);
          }
          return;
        }
        [...node.children].forEach(function(win, i) {
          const nextChar = text[i];
          if (win.dataset.digit === nextChar) return;
          const prevChar = win.dataset.digit || "0";
          win.dataset.digit = nextChar;
          const outgoing = newGlyph(prevChar);
          const incoming = newGlyph(nextChar);
          win.replaceChildren(outgoing, incoming);
          if (reduceMotion.matches || !incoming.animate) {
            win.replaceChildren(incoming);
            return;
          }
          const options = { duration: 540, easing: "cubic-bezier(.19,.75,.2,1)", fill: "forwards" };
          outgoing.animate([
            { transform: "translate3d(0,0,0)", opacity: 1 },
            { transform: "translate3d(0,43%,0)", opacity: 0 }
          ], options);
          const animation = incoming.animate([
            { transform: "translate3d(0,-43%,0)", opacity: 0 },
            { transform: "translate3d(0,0,0)", opacity: 1 }
          ], options);
          animation.finished.then(function() {
            if (win.dataset.digit === nextChar && incoming.parentNode === win) {
              win.replaceChildren(incoming);
            }
          }).catch(function(){ /* The next digit may supersede the prior animation. */ });
        });
      }

      // Real 60-mark bezel: 60 SVG line segments (every fifth one is longer).
      const unitMax = [12, 4, 7, 24, 60, 60];
      const ns = "http://www.w3.org/2000/svg";
      const tickSets = ids.map(function(id) {
        const dial = nodes[id].closest(".dial");
        const svg = document.createElementNS(ns, "svg");
        svg.setAttribute("viewBox", "0 0 200 200");
        svg.setAttribute("class", "tick-ring");
        svg.setAttribute("aria-hidden", "true");
        svg.setAttribute("focusable", "false");
        const ticks = [];
        for (let i = 0; i < 60; i++) {
          const tick = document.createElementNS(ns, "line");
          tick.setAttribute("x1", "100");
          tick.setAttribute("x2", "100");
          tick.setAttribute("y1", "7.5");
          tick.setAttribute("y2", i % 5 === 0 ? "22" : "18");
          tick.setAttribute("transform", "rotate(" + (i * 6) + " 100 100)");
          tick.setAttribute("class", i % 5 === 0 ? "tick-mark major" : "tick-mark");
          svg.appendChild(tick);
          ticks.push(tick);
        }
        dial.insertBefore(svg, nodes[id]);
        return {dial:dial,ticks:ticks,lastCount:-1};
      });
      function updateDial(node, number, index) {
        const fraction = Math.max(0, Math.min(1, number / unitMax[index]));
        const set = tickSets[index];
        const illuminated = Math.max(1, Math.round(fraction * 60));
        set.dial.classList.toggle("danger", fraction <= .10);
        set.dial.classList.toggle("warn", fraction > .10 && fraction <= .20);
        if (set.lastCount === illuminated) return;
        set.lastCount = illuminated;
        for (let i = 0; i < 60; i++) {
          set.ticks[i].classList.toggle("active", i < illuminated);
        }
      }

            function update() {
        const now = Date.now();
        const remaining = Math.max(0, TARGET - now);
        const numbers = breakdown(Math.floor(now / 1000) * 1000);
        ids.forEach(function(id, i) {
          setNumber(nodes[id], numbers[i]);
          updateDial(nodes[id], numbers[i], i);
        });

        if (now >= TARGET && !completed) {
          completed = true;
          screenreader.textContent = "The countdown has finished. It's March 4, 2027 in Baghdad.";
        } else if (remaining > 0) {
          const minute = Math.floor(now / 60000);
          if (minute !== lastAnnouncement) {
            lastAnnouncement = minute;
            screenreader.textContent = numbers[0] + " months, " + numbers[1] + " weeks, " +
              numbers[2] + " days, " + numbers[3] + " hours, " + numbers[4] +
              " minutes until March 4, 2027.";
          }
        }
        // Re-align to the real clock every tick: no drift after tab suspension.
        if (remaining > 0) {
          const wait = Math.max(80, 1000 - (Date.now() % 1000) + 18);
          setTimeout(update, wait);
        }
      }
      update();
      // If a sleeping browser tab resumes, refresh immediately.
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && !completed) update();
      });
    })();
  </script>

  <script>

لمتواصل ما يخلي المهمة أسهل"],"b":["جزئ المطلوب وابدأ","سيطر على الخطوة الجاية","خلي الوضوح يهزم الفوضى","التنظيم وقت الشدة ينقذك","لا تخلي التوتر يقود قرارك"]},{"a":["احترامك لنفسك يبان بوعدك لنفسك","كل وعد تكسره لنفسك يضعف ثقتك بيها","الكرامة تحتاج حدود مو حجي","قيمة نفسك ما تحتاج إعلان","إذا ما تحترم وقتك لا تنتظر غيرك يحترمه"],"b":["كون صادق ويا نفسك","خلي سلوكك يعبر عن مبادئك","لا تبيع قناعاتك لإعجاب مؤقت","التزامك يبني ثقة داخلية","احترم مواعيدك مع مستقبلك"]},{"a":["الاستعداد الكامل لأي بداية وهم","انتظار كل التفاصيل ممكن يدفن الفكرة","المثالية المبالغ بيها وجه ثاني للخوف","مسودة قابلة للتطوير خير من حلم مخفي","البداية الواعية ما تحتاج كل الضمانات"],"b":["جهز الأساس وانطلق","لا تستخدم التحضير حتى تهرب","اختبر أفكارك بالواقع","التصحيح جزء من الطريق","الجاهزية تزيد بالممارسة"]},{"a":["العاجل مو دائماً أهم من حلمك","الخطة الجميلة ما تنفع بعد فوات الوقت","بعدين ممكن تبتلع فرصة اليوم","إذا تكدر تغير شي هسه لا تنتظر","التأخير المستمر يصير قرار ضدك"],"b":["تحرك قبل ما تضيع النافذة","الوقت ما يوقف للمستعدين","لا تستبدل الحسم بوعود","ابدأ بالفعل الأكثر تأثيراً","انقذ الفرصة قبل ما تصير ذكرى"]},{"a":["الخطة بلا خطوة مجرد ورقة","الجدول المستحيل فخ للإحباط","التخطيط المفيد يختصر الوقت","كل مشروع يحتاج نقطة مراجعة","بدون قياس تقدمك ممكن تدور بنفس المكان"],"b":["حدد بداية واضحة","خلي أهدافك قابلة للفحص","عدل خطتك حسب الواقع","الورقة تنفع من تقود فعلك","لا تنسى التنفيذ داخل التخطيط"]},{"a":["بيئتك إما تساعدك أو تشغلك","المشتت القريب أقوى من النية البعيدة","مكانك المرتب يوفر تعب ذهني","لمن كل أدوات التسويف حولك يصعب الالتزام","العادات تنمو بالبيئة اللي تسمحلها"],"b":["صمم محيط يشجع الفعل","أبعد المشتتات عنك","خلي أدوات شغلك قريبة","هيئ المكان قبل البداية","سهّل الصح وصعّب الخطأ"]},{"a":["التقدم الصغير يتراكم حتى لو ما ينشاف","مو مطلوب تقفز عشر مراحل بيوم","خطوة بعد الصفر تعتبر تغيير","البطيء المستمر يوصل أبعد من المنقطع","تأخر النتائج ما يعني انعدام الفائدة"],"b":["راقب الاتجاه مو السرعة وحدها","لا توقف لأن الإنجاز مو مبهر","الخطوة الصغيرة تفتح غيرها","أعط التراكم فرصته","الثبات يسبق القفزات"]},{"a":["القوة مو إنك ما تتعب","الطريق الطويل يحتاج صبر ووعي","العقبات ما تروح بالإنكار","يوم سيئ ما يمسح سنة عمل","الوقفة المؤقتة ما لازم تصير استسلام"],"b":["راجع خطتك وارجع","لا تخلي عثرة واحدة تنهي المحاولة","الحركة بعد الوقفة هي المهم","اعرف متى تستريح وتكمل","الصمود الذكي أفضل من العناد"]},{"a":["إذا ما تحاسب نفسك الواقع راح يحاسبك","مو كل شي تحبه ينفعك","تجاهل الحقيقة ما يغيرها","التعب بلا اتجاه صح يضيّع مجهود","بعض العادات اللي تدافع عنها تأخرك"],"b":["واجه واقعك حتى تصلحه","خلي الدليل بدل التبرير","كن صارم مع العادة مو مع قيمتك","اقبل اللي يساعدك تتقدم","راجع قراراتك بجرأة"]},{"a":["البداية الجديدة ما تحتاج يوم أول السنة","إذا خرب اليوم لا تخرب باچر","التأخر عن البداية مو سبب لتأجيلها أكثر","تقدر تغير مسارك بعد سنين","الماضي ما يمنع صفحة جديدة"],"b":["ابدأ من مكانك الحالي","خذ خطوة بلا إعلان","ارجع للعمل أسرع من الأعذار","مستقبلك ما يحتاج اعتذار","ثبت البداية بسلوك جديد"]},{"a":["بعض المكاسب تحتاج تتخلى عن شي","لا تكدر تختار كل الطرق بوقت واحد","كل مرحلة إلها ثمن واعي","التضحية المدروسة غير ضياع العمر","الهدف الكبير يحتاج ترك عادة صغيرة"],"b":["لا تتمسك بكل شي","ادفع ثمن القرار لا ثمن التردد","حدد شنو يستحق البقاء","افتح مساحة للتقدم","مو كل خسارة علامة فشل"]},{"a":["مراجعة غلطك استثمار بالوقت","الخبرة تتجمع من محاولات صادقة","الخطة اللي ترفض التعديل تكرر أخطاءها","بعض الدروس موجعة لأنك تجاهلت البداية","اللي يراجع شغله يتقدم أكثر"],"b":["سجل الدرس وعدل الخطوة","المراجعة تطوير مو جلد ذات","استفد بدل ما تكرر","لا تسمح لكبرياءك يعطلك","اسأل شنو تسوي بشكل مختلف"]},{"a":["العادة السيئة تسرق وقتك بدون استئذان","المتعة السريعة ممكن تترك خسارة بطيئة","قرار اللحظة يتحول لعادة سنين","كل فعل متكرر يدرب عقلك عليه","أخطر شي تتعود على ما يضرك"],"b":["بدل العادة بخطوة مفيدة","لا تستخف بالتكرار اليومي","راقب سلوكك مو وعودك","اكسر النمط بوعي","غير البيئة اللي تغذي العادة"]},{"a":["النجاح مو لقطة على الشاشة","النتيجة الكبيرة وراها أيام عمل صامتة","إذا تريد ثمار غيرك افهم سنوات تعبهم","ماكو اختصار مستمر يغني عن الأساس","المظهر اللامع مو ضمان النجاح"],"b":["ابن الأساس قبل المظاهر","اشتغل على اللي يبقى","خلي يومك يخدم سنة نجاح","النجاح يحتاج جذور","تعب على الجوهر لا الصورة"]},{"a":["أول ساعة من يومك تقدر تحدد إيقاع الباقي","إذا تبدي متشتت تتعب حتى تتجمع","الصباح ما يحتاج طقوس معقدة","كل نهار فرصة لانضباط جديد","السيطرة على البداية تقلل فوضى الباقي"],"b":["ابدأ بمهمة إلها معنى","خلي البداية بسيطة","لا تبيع تركيزك للإشعارات","احسم أول قرار بوعي","ابدأ بقصد مو برد فعل"]}];
const quotes=originals.concat(groups.flatMap(g=>g.a.flatMap(a=>g.b.map(b=>a+"؛ "+b+"."))));
const target=document.getElementById("daily-quote");
if(!target)return;
const reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)");
const key="mx-timer-quote-bag-v4";
let bag=[],pos=0,previous=-1,busy=false;
function shuffle(last){
 bag=Array.from({length:quotes.length},(_,i)=>i);
 for(let i=bag.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [bag[i],bag[j]]=[bag[j],bag[i]];
 }
 if(last===bag[0]&&bag.length>1)[bag[0],bag[1]]=[bag[1],bag[0]];
 pos=0;
}
function save(){try{sessionStorage.setItem(key,JSON.stringify({bag,pos,previous}));}catch(_){}}
try{
 const state=JSON.parse(sessionStorage.getItem(key)||"null");
 if(state && Array.isArray(state.bag)&&state.bag.length===quotes.length&&
   new Set(state.bag).size===quotes.length&&state.bag.every(n=>Number.isInteger(n)&&n>=0&&n<quotes.length)&&
   Number.isInteger(state.pos)&&state.pos>=0&&state.pos<=quotes.length){
   bag=state.bag;pos=state.pos;previous=Number.isInteger(state.previous)?state.previous:-1;
 }
}catch(_){}
if(bag.length!==quotes.length)shuffle(-1);
function next(){
 if(pos>=bag.length)shuffle(previous);
 let idx=bag[pos++];
 if(idx===previous){
  if(pos<bag.length){[bag[pos-1],bag[pos]]=[bag[pos],bag[pos-1]];idx=bag[pos-1];}
  else {shuffle(previous);idx=bag[pos++];}
 }
 previous=idx;target.textContent=quotes[idx];save();
}
next();
function rotate(){
 if(busy||document.hidden)return;
 if(reducedMotion.matches){next();return;}
 busy=true;
 target.classList.remove("quote-arrive");
 target.classList.add("quote-exit");
 setTimeout(()=>{
  next();target.classList.remove("quote-exit");
  void target.offsetWidth;target.classList.add("quote-arrive");
  setTimeout(()=>{target.classList.remove("quote-arrive");busy=false;},950);
 },400);
}
setInterval(rotate,15000);
})();
