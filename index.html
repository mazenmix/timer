<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d17">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MX Timer">
  <meta name="description" content="A beautiful live countdown to March 4, 2027 — the journey to Manila.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="MX Timer">
  <meta property="og:description" content="Counting down every second to March 4, 2027.">
  <title>MX Timer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <style>
    :root {
      --bg: #080d17;
      --text: #f7f7fa;
      --muted: #9ba6b9;
      --gold: #e9c88a;
      --gold-soft: #f9e7bc;
      --line-gold: rgba(233,200,138,.24);
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      overflow-x: hidden; color: var(--text);
      background:
        radial-gradient(ellipse 48% 32% at 50% 0%, rgba(54,78,119,.24), transparent 85%),
        radial-gradient(ellipse 34% 40% at 93% 60%, rgba(112,84,50,.075), transparent 100%),
        radial-gradient(ellipse 30% 25% at 3% 70%, rgba(37,64,106,.12), transparent 100%), var(--bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "tnum" 1;
    }
    body::before {
      content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.25;
      background-image:radial-gradient(rgba(255,255,255,.43) .65px,transparent .65px);
      background-size:43px 43px;
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 68%);
    }
    .ambient {
      pointer-events:none; position:absolute; z-index:0;
      top:110px; left:50%; transform:translateX(-50%);
      width:min(920px,95vw); height:550px; border-radius:50%;
      background:radial-gradient(ellipse,rgba(235,190,118,.045),transparent 65%);
      filter:blur(26px);
    }
    .shell {
      position:relative; z-index:1; max-width:1312px; margin:0 auto;
      padding:0 clamp(20px,5vw,68px);
      min-height:100vh; min-height:100svh;
      display:flex; flex-direction:column; justify-content:center;
    }
    main { padding-block:clamp(24px,5vw,64px); width:100%; }
    .countdown {
      position:relative; overflow:hidden;
      padding:clamp(22px,3.7vw,48px);
      border-radius:25px;
      background:linear-gradient(141deg,rgba(24,34,50,.94) 0%,rgba(16,23,37,.98) 49%,rgba(17,24,38,.97) 100%);
      border:1px solid rgba(227,234,248,.115);
      box-shadow:0 24px 100px rgba(0,0,0,.22),0 1px 0 rgba(255,255,255,.035) inset;
    }
    .countdown::before {
      content:""; position:absolute; top:0; left:16%; right:16%; height:1px;
      background:linear-gradient(90deg,transparent,rgba(233,200,138,.6),transparent);
    }
    .time-grid { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:clamp(8px,1.4vw,16px); }
    .time-unit {
      position:relative; min-width:0; text-align:center;
      padding:clamp(19px,2.7vw,32px) 6px clamp(18px,2.4vw,27px);
      background:linear-gradient(165deg,rgba(31,42,60,.68),rgba(15,23,36,.80));
      border:1px solid rgba(235,240,249,.075); border-radius:16px;
      transition:border-color .3s,transform .3s,box-shadow .3s;
    }
    .time-unit:hover {
      border-color:var(--line-gold); transform:translateY(-2px);
      box-shadow:0 12px 30px rgba(0,0,0,.13);
    }
    .time-unit:last-child {
      border-color:var(--line-gold);
      background:linear-gradient(155deg,rgba(233,200,138,.105),rgba(25,29,38,.85));
    }
    .time-value {
      display:block; white-space:nowrap; font-weight:530;
      font-variant-numeric:tabular-nums lining-nums;
      font-size:clamp(37px,4.9vw,73px);
      letter-spacing:-.065em; line-height:1.18; color:#fff;
    }
    .time-unit:last-child .time-value { color:var(--gold-soft); }
    .time-value.tick { animation:digit-in .27s ease-out; }
    @keyframes digit-in {
      from { opacity:.58; transform:translateY(4px); filter:blur(1px); }
      to { opacity:1; transform:translateY(0); filter:blur(0); }
    }
    .time-label {
      display:block; margin-top:14px;
      font-size:clamp(9px,.85vw,11px); font-weight:740;
      letter-spacing:.2em; color:var(--muted);
    }
    .sr-only {
      position:absolute; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }
    @media (max-width:880px) {
      .time-grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
      .time-value { font-size:clamp(46px,8.5vw,72px); }
      .time-unit { padding:24px 8px; }
      .time-label { font-size:10px; }
      .countdown { padding:27px; }
    }
    @media (max-width:560px) {
      .shell { padding-inline:17px; }
      main { padding-block:24px; }
      .countdown { padding:19px 14px 20px; border-radius:20px; }
      .time-grid { gap:9px; }
      .time-unit { padding:20px 3px 17px; border-radius:13px; }
      .time-value { font-size:clamp(41px,10vw,55px); }
      .time-label { letter-spacing:.11em; font-size:9px; margin-top:9px; }
    }
    @media (max-width:355px) {
      .shell { padding-inline:12px; }
      .countdown { padding-inline:11px; }
      .time-grid { gap:6px; }
      .time-value { font-size:38px; }
      .time-label { font-size:8px; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="shell">
    <main>

      <section class="countdown" aria-label="Live countdown to March 4, 2027">
        <div class="time-grid" id="timer" role="timer" aria-live="off">
          <div class="time-unit"><span id="months" class="time-value">--</span><span class="time-label">MONTHS</span></div>
          <div class="time-unit"><span id="weeks" class="time-value">--</span><span class="time-label">WEEKS</span></div>
          <div class="time-unit"><span id="days" class="time-value">--</span><span class="time-label">DAYS</span></div>
          <div class="time-unit"><span id="hours" class="time-value">--</span><span class="time-label">HOURS</span></div>
          <div class="time-unit"><span id="minutes" class="time-value">--</span><span class="time-label">MINUTES</span></div>
          <div class="time-unit"><span id="seconds" class="time-value">--</span><span class="time-label">SECONDS</span></div>
        </div>
      </section>

    </main>
  </div>
  <div class="sr-only" id="screenreader" aria-live="polite" aria-atomic="true"></div>
  <script>
    (function () {
      "use strict";
      // March 4, 2027 at 00:00 Baghdad time (Asia/Baghdad, UTC+03).
      // An explicit UTC instant means all devices count down to the SAME moment.
      const TARGET = Date.parse("2027-03-03T21:00:00Z");
      const BAGHDAD_OFFSET_MS = 3 * 60 * 60 * 1000;
      const formatter = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Baghdad", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
      });
      const ids = ["months", "weeks", "days", "hours", "minutes", "seconds"];
      const nodes = Object.fromEntries(ids.map(function(id) { return [id, document.getElementById(id)]; }));
      const screenreader = document.getElementById("screenreader");
      let lastAnnouncement = -1;
      let completed = false;

      function partsAt(instant) {
        const parts = {};
        formatter.formatToParts(new Date(instant)).forEach(function(part) {
          if (part.type !== "literal") parts[part.type] = Number(part.value);
        });
        return parts;
      }

      function plusMonths(original, count) {
        const index = original.year * 12 + original.month - 1 + count;
        const year = Math.floor(index / 12);
        const month = index - year * 12 + 1;
        const maxDay = new Date(Date.UTC(year, month, 0)).getUTCDate();
        return {
          year: year, month: month, day: Math.min(original.day, maxDay),
          hour: original.hour, minute: original.minute, second: original.second
        };
      }

      function baghdadInstant(parts) {
        return Date.UTC(parts.year, parts.month - 1, parts.day,
          parts.hour, parts.minute, parts.second) - BAGHDAD_OFFSET_MS;
      }

      function breakdown(now) {
        if (now >= TARGET) return [0, 0, 0, 0, 0, 0];
        const localNow = partsAt(now);
        let months = Math.max(0, (2027 - localNow.year) * 12 + (3 - localNow.month));
        while (months > 0 && baghdadInstant(plusMonths(localNow, months)) > TARGET) months--;
        while (baghdadInstant(plusMonths(localNow, months + 1)) <= TARGET) months++;
        let remainingSeconds = Math.floor((TARGET - baghdadInstant(plusMonths(localNow, months))) / 1000);
        const weeks = Math.floor(remainingSeconds / 604800); remainingSeconds %= 604800;
        const days = Math.floor(remainingSeconds / 86400); remainingSeconds %= 86400;
        const hours = Math.floor(remainingSeconds / 3600); remainingSeconds %= 3600;
        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = remainingSeconds % 60;
        return [months, weeks, days, hours, minutes, seconds];
      }

      function setNumber(node, number) {
        const value = String(number).padStart(2, "0");
        if (node.textContent === value) return;
        node.textContent = value;
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          node.classList.remove("tick");
          void node.offsetWidth;
          node.classList.add("tick");
        }
      }

      function update() {
        const now = Date.now();
        const remaining = Math.max(0, TARGET - now);
        const numbers = breakdown(Math.floor(now / 1000) * 1000);
        ids.forEach(function(id, i) { setNumber(nodes[id], numbers[i]); });

        if (now >= TARGET && !completed) {
          completed = true;
          screenreader.textContent = "The countdown has finished. It's March 4, 2027 in Baghdad.";
        } else if (remaining > 0) {
          const minute = Math.floor(now / 60000);
          if (minute !== lastAnnouncement) {
            lastAnnouncement = minute;
            screenreader.textContent = numbers[0] + " months, " + numbers[1] + " weeks, " +
              numbers[2] + " days, " + numbers[3] + " hours, " + numbers[4] +
              " minutes until March 4, 2027.";
          }
        }
        // Re-align to the real clock every tick: no drift after tab suspension.
        if (remaining > 0) {
          const wait = Math.max(80, 1000 - (Date.now() % 1000) + 18);
          setTimeout(update, wait);
        }
      }
      update();
      // If a sleeping browser tab resumes, refresh immediately.
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && !completed) update();
      });
    })();
  </script>
</body>
</html>
