  <style>
  :root{color-scheme:dark;--green:#56ffc0;--text:#f4fafb;--line:rgba(105,255,199,.3);}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;width:100%;background:#02090d}
  html{min-width:320px}
  body{overflow-x:hidden;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums lining-nums}
  .screen{position:relative;display:flex;align-items:center;justify-content:center;isolation:isolate;min-height:100vh;min-height:100svh;overflow:hidden;padding:clamp(15px,3vw,40px);background:radial-gradient(ellipse at 50% 30%,#0b2926 0%,#041319 31%,#02090c 67%,#010509 100%)}
  .cosmos{position:absolute;inset:0;width:100%;height:100%;z-index:-3;pointer-events:none;object-fit:cover}
  .screen::before{content:"";position:absolute;z-index:-2;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 31%,rgba(19,255,152,.065),transparent 43%),linear-gradient(90deg,rgba(0,0,0,.36),transparent 20%,transparent 80%,rgba(0,0,0,.36))}
  .screen::after{content:"";position:absolute;z-index:-1;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.23) 85%,rgba(0,0,0,.47) 100%)}
  .axis{position:absolute;top:0;bottom:0;left:50%;width:1px;background:linear-gradient(transparent,rgba(75,255,175,.22) 21%,rgba(75,255,175,.32) 52%,transparent 94%);pointer-events:none}
  .axis::before,.axis::after{content:"";position:absolute;left:-4px;width:9px;height:9px;background:#69ffc3;border-radius:50%;box-shadow:0 0 0 9px rgba(78,255,173,.05),0 0 15px rgba(78,255,173,.6)}
  .axis::before{top:8%}.axis::after{bottom:8%}
  .orbit{position:absolute;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%);width:min(89vw,980px);aspect-ratio:1;border:1px solid rgba(63,216,165,.14);border-radius:50%;pointer-events:none}
  .orbit.o2{width:min(73vw,800px);border-style:dashed;border-color:rgba(71,195,145,.095)}
  .orbit.o3{width:min(52vw,580px);border-color:rgba(71,195,145,.075)}
  .frame{position:relative;width:min(1310px,100%);min-height:318px;padding:48px clamp(22px,3vw,43px);display:flex;align-items:center;justify-content:center;border-radius:34px;isolation:isolate;background:linear-gradient(180deg,rgba(4,16,18,.93),rgba(3,14,17,.985) 40%,rgba(4,16,19,.94));border:1px solid rgba(93,255,191,.40);box-shadow:0 1px 0 rgba(174,255,217,.18) inset,0 -1px 0 rgba(93,255,188,.10) inset,0 24px 85px rgba(0,0,0,.58),0 0 45px rgba(6,255,157,.12);backdrop-filter:blur(6px)}
  .frame::before{content:"";position:absolute;inset:17px 18px;border:1px solid rgba(56,196,155,.12);border-radius:22px;pointer-events:none}
  .frame::after{content:"";position:absolute;left:50%;top:-2px;transform:translateX(-50%);height:4px;width:clamp(80px,13vw,160px);background:linear-gradient(90deg,transparent,#63ffc5,transparent);border-radius:5px;box-shadow:0 0 14px #38fcb4;pointer-events:none}
  .frame-bottom{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:4px;width:clamp(80px,13vw,160px);background:linear-gradient(90deg,transparent,#63ffc5,transparent);border-radius:5px;box-shadow:0 0 15px rgba(75,255,192,.5);pointer-events:none}
  .edge{position:absolute;top:45%;width:5px;height:55px;background:#49ffc0;box-shadow:0 0 20px rgba(67,255,177,.85)}
  .edge.left{left:-2px}.edge.right{right:-2px}
  .time-grid{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));width:100%;align-items:center;gap:clamp(7px,1.1vw,15px)}
  .time-unit{position:relative;min-width:0;display:flex;align-items:center;justify-content:center;height:194px;border-radius:17px;background:linear-gradient(180deg,rgba(13,29,32,.24),rgba(2,13,15,.1));border:1px solid rgba(74,173,148,.035)}
  .time-unit:not(:last-child)::after{content:"";position:absolute;right:calc(clamp(7px,1.1vw,15px) / -2 - 1px);top:29%;height:42%;width:1px;background:linear-gradient(transparent,rgba(80,224,165,.3),transparent);box-shadow:0 0 6px rgba(80,224,165,.4)}
  .dial{--fill:18%;position:relative;width:min(100%,150px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from -60deg,var(--green) 0 var(--fill),rgba(72,137,113,.23) var(--fill) 100%);box-shadow:0 0 0 1px rgba(85,237,184,.08),0 0 16px rgba(38,255,169,.12)}
  .dial::before{content:"";position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 50% 42%,#0b171d 0%,#071216 65%,#07191a 100%);box-shadow:inset 0 0 0 1px rgba(117,222,187,.08),inset 0 0 24px rgba(0,0,0,.6)}
  .dial::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(78,204,153,.095);pointer-events:none}
  .time-value{z-index:1;position:relative;color:#f4f8fa;font-size:clamp(39px,4.4vw,66px);letter-spacing:-.045em;font-weight:730;line-height:1;white-space:nowrap;text-shadow:0 1px 14px rgba(255,255,255,.10)}
  .time-value.tick{animation:digit .24s ease-out}
  @keyframes digit{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .time-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media(max-width:1100px){.frame{min-height:255px;padding:32px 23px}.time-unit{height:155px}.dial{width:min(100%,122px)}.time-value{font-size:clamp(31px,4.2vw,55px)}}
  @media(max-width:710px){
    .screen{padding:16px}
    .cosmos{height:100%;width:100%;object-fit:cover}
    .frame{width:min(540px,100%);padding:34px 18px;min-height:0;border-radius:24px}
    .time-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 8px}
    .time-unit{height:auto;aspect-ratio:1}
    .time-unit::after{display:none}
    .dial{width:min(90%,125px)}
    .time-value{font-size:clamp(35px,8.2vw,52px)}
    .orbit{width:125vw}.orbit.o2{width:105vw}.orbit.o3{width:75vw}
  }
  @media(max-width:370px){.screen{padding:9px}.frame{padding:30px 10px}.time-grid{gap:6px}.time-value{font-size:35px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<script>
    (function () {
      "use strict";
      // March 4, 2027 at 00:00 Baghdad time (Asia/Baghdad, UTC+03).
      // An explicit UTC instant means all devices count down to the SAME moment.
      const TARGET = Date.parse("2027-03-03T21:00:00Z");
      const BAGHDAD_OFFSET_MS = 3 * 60 * 60 * 1000;
      const formatter = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Baghdad", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
      });
      const ids = ["months", "weeks", "days", "hours", "minutes", "seconds"];
      const nodes = Object.fromEntries(ids.map(function(id) { return [id, document.getElementById(id)]; }));
      const screenreader = document.getElementById("screenreader");
      let lastAnnouncement = -1;
      let completed = false;

      function partsAt(instant) {
        const parts = {};
        formatter.formatToParts(new Date(instant)).forEach(function(part) {
          if (part.type !== "literal") parts[part.type] = Number(part.value);
        });
        return parts;
      }

      function plusMonths(original, count) {
        const index = original.year * 12 + original.month - 1 + count;
        const year = Math.floor(index / 12);
        const month = index - year * 12 + 1;
        const maxDay = new Date(Date.UTC(year, month, 0)).getUTCDate();
        return {
          year: year, month: month, day: Math.min(original.day, maxDay),
          hour: original.hour, minute: original.minute, second: original.second
        };
      }

      function baghdadInstant(parts) {
        return Date.UTC(parts.year, parts.month - 1, parts.day,
          parts.hour, parts.minute, parts.second) - BAGHDAD_OFFSET_MS;
      }

      function breakdown(now) {
        if (now >= TARGET) return [0, 0, 0, 0, 0, 0];
        const localNow = partsAt(now);
        let months = Math.max(0, (2027 - localNow.year) * 12 + (3 - localNow.month));
        while (months > 0 && baghdadInstant(plusMonths(localNow, months)) > TARGET) months--;
        while (baghdadInstant(plusMonths(localNow, months + 1)) <= TARGET) months++;
        let remainingSeconds = Math.floor((TARGET - baghdadInstant(plusMonths(localNow, months))) / 1000);
        const weeks = Math.floor(remainingSeconds / 604800); remainingSeconds %= 604800;
        const days = Math.floor(remainingSeconds / 86400); remainingSeconds %= 86400;
        const hours = Math.floor(remainingSeconds / 3600); remainingSeconds %= 3600;
        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = remainingSeconds % 60;
        return [months, weeks, days, hours, minutes, seconds];
      }

      function setNumber(node, number) {
        const value = String(number).padStart(2, "0");
        if (node.textContent === value) return;
        node.textContent = value;
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          node.classList.remove("tick");
          void node.offsetWidth;
          node.classList.add("tick");
        }
      }

      function update() {
        const now = Date.now();
        const remaining = Math.max(0, TARGET - now);
        const numbers = breakdown(Math.floor(now / 1000) * 1000);
        ids.forEach(function(id, i) {
          setNumber(nodes[id], numbers[i]);
          const max = [12, 4, 7, 24, 60, 60][i];
          const fraction = ((numbers[i] % max) / max);
          const percent = Math.round(10 + (1 - fraction) * 18);
          nodes[id].parentElement.style.setProperty("--fill", percent + "%");
        });

        if (now >= TARGET && !completed) {
          completed = true;
          screenreader.textContent = "The countdown has finished. It's March 4, 2027 in Baghdad.";
        } else if (remaining > 0) {
          const minute = Math.floor(now / 60000);
          if (minute !== lastAnnouncement) {
            lastAnnouncement = minute;
            screenreader.textContent = numbers[0] + " months, " + numbers[1] + " weeks, " +
              numbers[2] + " days, " + numbers[3] + " hours, " + numbers[4] +
              " minutes until March 4, 2027.";
          }
        }
        // Re-align to the real clock every tick: no drift after tab suspension.
        if (remaining > 0) {
          const wait = Math.max(80, 1000 - (Date.now() % 1000) + 18);
          setTimeout(update, wait);
        }
      }
      update();
      // If a sleeping browser tab resumes, refresh immediately.
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && !completed) update();
      });
    })();
  </script>
</body>
</html>
