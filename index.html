<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#040a0e">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MX Timer">
  <meta name="description" content="A beautiful live countdown to March 4, 2027 — the journey to Manila.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="MX Timer">
  <meta property="og:description" content="Counting down every second to March 4, 2027.">
  <title>MX Timer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
  <link rel="manifest" href="site.webmanifest?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
  <style>
:root {
  color-scheme: dark;
  --bg: #04090d;
  --panel: #09161a;
  --text: #f8fffd;
  --muted: #afcfc6;
  --mint-ice: #e3fff6;
  --mint-light: #baffea;
  --mint: #68ffcd;
  --emerald: #21ffab;
  --ring-track: #11362d;
}
* {box-sizing:border-box}
html {min-width:320px;min-height:100%;background:var(--bg)}
body {
  margin:0;
  min-height:100vh;
  min-height:100svh;
  overflow-x:hidden;
  color:var(--text);
  background:#04090d;
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-feature-settings:"tnum" 1;
}
.screen {
  min-height:100vh;
  min-height:100svh;
  padding:clamp(12px,3vw,38px);
  display:flex;
  align-items:center;
  justify-content:center;
}
.timer-shell {
  position:relative;
  width:min(1280px,100%);
  padding:clamp(26px,3.45vw,44px) clamp(16px,2.8vw,36px);
  border-radius:30px;
  background:
    linear-gradient(157deg,rgba(23,48,47,.16),transparent 42%),
    linear-gradient(180deg,#0c1b1d 0%,#071114 58%,#0a171a 100%);
  border:1px solid rgba(138,255,212,.24);
  box-shadow:
    inset 0 1px 0 rgba(245,255,251,.09),
    inset 0 -1px 0 rgba(104,255,194,.07),
    0 20px 75px rgba(0,0,0,.54),
    0 0 42px rgba(25,255,164,.065);
}
.timer-shell::before,.timer-shell::after {
  content:"";
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:clamp(72px,9vw,115px);
  height:2px;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#d5fff1 45%,#62ffc6 60%,transparent);
  box-shadow:0 0 14px rgba(80,255,181,.52);
  pointer-events:none;
}
.timer-shell::before {top:0}
.timer-shell::after {bottom:0}
.grid {
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:clamp(8px,1.2vw,16px);
  align-items:center;
}
.unit {
  position:relative;
  min-width:0;
  min-height:203px;
  padding:14px 4px 12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  border-radius:22px;
  background:linear-gradient(180deg,rgba(31,64,59,.12),rgba(8,16,20,.035));
}
.unit:not(:last-child)::after {
  content:"";
  position:absolute;
  right:calc(clamp(8px,1.2vw,16px)/-2);
  top:33%;
  width:1px;
  height:33%;
  background:linear-gradient(transparent,rgba(116,255,207,.26),transparent);
  box-shadow:0 0 10px rgba(31,255,171,.16);
}
.dial {
  --p:34%;
  position:relative;
  display:grid;
  place-items:center;
  isolation:isolate;
  flex-shrink:0;
  width:min(100%,160px);
  aspect-ratio:1;
  border-radius:50%;
  /* A sharp, high-resolution CSS ring instead of a blurred bitmap. */
  background:conic-gradient(from -90deg,
    var(--mint-ice) 0%,
    var(--mint-light) 2.5%,
    #8fffd9 5%,
    #53ffc4 10%,
    var(--emerald) var(--p),
    #10392e var(--p),
    #15332e 100%);
  box-shadow:
    0 0 0 1px rgba(169,255,223,.35),
    0 0 6px rgba(99,255,196,.4),
    0 0 21px rgba(48,255,169,.28),
    0 0 45px rgba(27,255,164,.12),
    inset 0 0 1px 1px rgba(238,255,250,.3);
  transition:box-shadow .35s ease;
}
.dial::before {
  content:"";
  position:absolute;
  inset:7px;
  z-index:0;
  border-radius:50%;
  background:
    radial-gradient(ellipse at 49% 12%,rgba(158,255,220,.135),transparent 44%),
    radial-gradient(circle at 50% 43%,#152b2c,#0a191b 62%,#071114 100%);
  box-shadow:
    inset 0 0 0 1px rgba(167,255,214,.18),
    inset 0 2px 8px rgba(146,255,218,.09),
    inset 0 -13px 27px rgba(0,0,0,.38);
}
.dial::after {
  content:"";
  position:absolute;
  z-index:2;
  inset:2px;
  border-radius:50%;
  background:
    radial-gradient(ellipse at 25% 15%,rgba(255,255,255,.3),transparent 27%),
    linear-gradient(157deg,rgba(235,255,248,.22) 0%,rgba(204,255,238,.095) 21%,transparent 32%,transparent 76%,rgba(98,255,189,.045) 100%);
  mix-blend-mode:screen;
  pointer-events:none;
}
.shine {
  position:absolute;
  z-index:2;
  pointer-events:none;
  width:53%;
  height:19%;
  top:7%;
  left:16%;
  border-radius:50%;
  transform:rotate(-19deg);
  background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.02) 65%,transparent);
  filter:blur(4px);
}
.value {
  position:relative;
  z-index:3;
  color:#fbfffd;
  font-size:clamp(36px,4.45vw,64px);
  font-weight:770;
  line-height:1;
  letter-spacing:-.05em;
  font-variant-numeric:tabular-nums lining-nums;
  white-space:nowrap;
  text-shadow:0 1px 1px rgba(0,0,0,.3),0 0 10px rgba(255,255,255,.09),0 0 18px rgba(96,255,200,.10);
}
.value.tick {animation:tick .24s cubic-bezier(.2,.7,.3,1)}
@keyframes tick {from{opacity:.67;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
.label {
  color:var(--muted);
  font-size:clamp(9px,.9vw,12px);
  font-weight:760;
  line-height:1.3;
  text-align:center;
  letter-spacing:.15em;
  text-transform:uppercase;
  user-select:none;
}
.sr-only {
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
@media(max-width:1080px) {
  .timer-shell {padding:25px 17px}
  .unit {min-height:166px;gap:12px}
  .dial {width:min(100%,130px)}
  .value {font-size:clamp(34px,4vw,54px)}
}
@media(max-width:830px) {
  .timer-shell {max-width:560px;padding:25px 15px;border-radius:23px}
  .grid {grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
  .unit {min-height:0;aspect-ratio:1/1.16;padding:12px 4px;gap:12px}
  .unit:not(:last-child)::after {display:none}
  .dial {width:min(90%,143px)}
  .value {font-size:clamp(36px,7vw,55px)}
  .label {font-size:clamp(9px,1.8vw,11px)}
}
@media(max-width:480px) {
  .screen {padding:12px}
  .timer-shell {padding:20px 10px}
  .grid {gap:7px}
  .unit {border-radius:14px;gap:10px;padding:10px 2px}
  .dial {width:min(92%,113px)}
  .dial::before {inset:6px}
  .value {font-size:clamp(30px,8.6vw,45px)}
  .label {font-size:clamp(8px,2.4vw,10px);letter-spacing:.07em}
}
@media(max-width:350px) {
  .screen {padding:8px}
  .timer-shell {padding:19px 7px}
  .grid {gap:5px}
  .value {font-size:30px}
  .label {font-size:8px;letter-spacing:0}
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* MX Timer | watch-inspired slender numerals and finely lit 3D chronograph rings */
@property --progress {syntax:"<percentage>";initial-value:34%;inherits:false}
@property --arc-light {syntax:"<color>";initial-value:#e2fff5;inherits:false}
@property --arc-mid {syntax:"<color>";initial-value:#80ffda;inherits:false}
@property --arc-main {syntax:"<color>";initial-value:#24ffaa;inherits:false}
@property --arc-track {syntax:"<color>";initial-value:#12352d;inherits:false}
.dial {
  --progress:34%;
  --arc-light:#e2fff5;
  --arc-mid:#80ffda;
  --arc-main:#24ffaa;
  --arc-track:#13382e;
  background: conic-gradient(
    from -90deg,
    var(--arc-light) 0%,
    var(--arc-mid) 2.5%,
    var(--arc-main) var(--progress),
    var(--arc-track) var(--progress),
    var(--arc-track) 100%
  );
  box-shadow:
    0 0 0 1px color-mix(in srgb,var(--arc-mid) 35%,transparent),
    0 1px 1px rgba(255,255,255,.09) inset,
    0 0 8px color-mix(in srgb,var(--arc-main) 36%,transparent),
    0 0 26px color-mix(in srgb,var(--arc-main) 26%,transparent),
    0 0 51px color-mix(in srgb,var(--arc-main) 11%,transparent);
  transition:
    --progress .78s cubic-bezier(.2,.73,.22,1),
    --arc-light .72s ease,
    --arc-mid .72s ease,
    --arc-main .72s ease,
    --arc-track .72s ease,
    box-shadow .72s ease,
    filter .72s ease;
  filter:saturate(1.045);
  will-change:auto;
}
.dial.warn {
  --arc-light:#fffde8;
  --arc-mid:#ffe582;
  --arc-main:#ffc341;
  --arc-track:#48371b;
}
.dial.danger {
  --arc-light:#ffeae9;
  --arc-mid:#ff9993;
  --arc-main:#ff4d46;
  --arc-track:#492021;
}
.dial::before {
  background:
    radial-gradient(ellipse at 47% 8%,rgba(214,255,242,.13),transparent 47%),
    radial-gradient(ellipse at 50% 38%,#182d30 0%,#0b191c 56%,#071114 100%);
  box-shadow:
    inset 0 0 0 1px rgba(227,255,247,.13),
    inset 0 3px 6px rgba(255,255,255,.025),
    inset 0 -17px 33px rgba(0,0,0,.42),
    0 0 14px rgba(0,0,0,.27);
}
.dial::after {
  background:
    radial-gradient(ellipse at 24% 16%,rgba(255,255,255,.34),transparent 26%),
    linear-gradient(160deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.07) 19%,transparent 33%,transparent 73%,rgba(255,255,255,.035) 100%);
}
.shine {
  width:56%;
  height:20%;
  top:7%;
  left:17%;
  background:linear-gradient(180deg,rgba(255,255,255,.19),rgba(255,255,255,.015) 73%,transparent);
  filter:blur(3.3px);
}
/* Open-license condensed numerals approximate Zenith; Apple's proprietary font isn't embedded. */
.value {
  display:inline-flex;
  justify-content:center;
  align-items:center;
  gap:.008em;
  width:100%;
  height:1.18em;
  font-family:"Barlow Condensed","SF Pro Display","SF Compact Display","Arial Narrow",sans-serif;
  font-weight:600;
  font-size:clamp(56px,6.0vw,88px);
  line-height:1;
  letter-spacing:0;
  font-stretch:condensed;
  font-feature-settings:"tnum" 1, "ss01" 1, "ss02" 1;
  transform:scaleX(.88);
  text-shadow:0 1px 1px rgba(0,0,0,.38),0 0 11px rgba(255,255,255,.09);
  backface-visibility:hidden;
}
.digit-window {
  position:relative;
  display:inline-block;
  flex:0 0 .54em;
  width:.54em;
  height:1.12em;
  overflow:hidden;
}
.digit-face {
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#f6fffd;
  line-height:1;
  font-variant-numeric:tabular-nums;
  will-change:transform,opacity;
  backface-visibility:hidden;
}
@media(max-width:1080px) {
  .value {font-size:clamp(47px,5.5vw,71px)}
}
@media(max-width:830px) {
  .value {font-size:clamp(53px,10vw,77px)}
}
@media(max-width:480px) {
  .value {font-size:clamp(43px,13vw,63px)}
}
@media(max-width:350px) {
  .value {font-size:43px}
}

</style>
</head>
<body>
<div class="screen">
  <main class="timer-shell" aria-label="Live countdown to March 4, 2027">
    <section class="grid" id="timer" role="timer" aria-live="off"><div class="unit"><div class="dial"><span class="shine" aria-hidden="true"></span><span id="months" class="value">--</span></div><span class="label">MONTHS</span></div>
<div class="unit"><div class="dial"><span class="shine" aria-hidden="true"></span><span id="weeks" class="value">--</span></div><span class="label">WEEKS</span></div>
<div class="unit"><div class="dial"><span class="shine" aria-hidden="true"></span><span id="days" class="value">--</span></div><span class="label">DAYS</span></div>
<div class="unit"><div class="dial"><span class="shine" aria-hidden="true"></span><span id="hours" class="value">--</span></div><span class="label">HOURS</span></div>
<div class="unit"><div class="dial"><span class="shine" aria-hidden="true"></span><span id="minutes" class="value">--</span></div><span class="label">MINUTES</span></div>
<div class="unit"><div class="dial"><span class="shine" aria-hidden="true"></span><span id="seconds" class="value">--</span></div><span class="label">SECONDS</span></div></section>
  </main>
</div>
<div class="sr-only" id="screenreader" aria-live="polite" aria-atomic="true"></div>
<script>
    (function () {
      "use strict";
      // March 4, 2027 at 00:00 Baghdad time (Asia/Baghdad, UTC+03).
      // An explicit UTC instant means all devices count down to the SAME moment.
      const TARGET = Date.parse("2027-03-03T21:00:00Z");
      const BAGHDAD_OFFSET_MS = 3 * 60 * 60 * 1000;
      const formatter = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Baghdad", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
      });
      const ids = ["months", "weeks", "days", "hours", "minutes", "seconds"];
      const nodes = Object.fromEntries(ids.map(function(id) { return [id, document.getElementById(id)]; }));
      const screenreader = document.getElementById("screenreader");
      let lastAnnouncement = -1;
      let completed = false;

      function partsAt(instant) {
        const parts = {};
        formatter.formatToParts(new Date(instant)).forEach(function(part) {
          if (part.type !== "literal") parts[part.type] = Number(part.value);
        });
        return parts;
      }

      function plusMonths(original, count) {
        const index = original.year * 12 + original.month - 1 + count;
        const year = Math.floor(index / 12);
        const month = index - year * 12 + 1;
        const maxDay = new Date(Date.UTC(year, month, 0)).getUTCDate();
        return {
          year: year, month: month, day: Math.min(original.day, maxDay),
          hour: original.hour, minute: original.minute, second: original.second
        };
      }

      function baghdadInstant(parts) {
        return Date.UTC(parts.year, parts.month - 1, parts.day,
          parts.hour, parts.minute, parts.second) - BAGHDAD_OFFSET_MS;
      }

      function breakdown(now) {
        if (now >= TARGET) return [0, 0, 0, 0, 0, 0];
        const localNow = partsAt(now);
        let months = Math.max(0, (2027 - localNow.year) * 12 + (3 - localNow.month));
        while (months > 0 && baghdadInstant(plusMonths(localNow, months)) > TARGET) months--;
        while (baghdadInstant(plusMonths(localNow, months + 1)) <= TARGET) months++;
        let remainingSeconds = Math.floor((TARGET - baghdadInstant(plusMonths(localNow, months))) / 1000);
        const weeks = Math.floor(remainingSeconds / 604800); remainingSeconds %= 604800;
        const days = Math.floor(remainingSeconds / 86400); remainingSeconds %= 86400;
        const hours = Math.floor(remainingSeconds / 3600); remainingSeconds %= 3600;
        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = remainingSeconds % 60;
        return [months, weeks, days, hours, minutes, seconds];
      }

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      // Each digit slides independently, keeping a stable baseline and avoiding text-width jumps.
      function newGlyph(char) {
        const glyph = document.createElement("span");
        glyph.className = "digit-face";
        glyph.textContent = char;
        return glyph;
      }
      function setNumber(node, number) {
        const text = String(number).padStart(2, "0");
        if (node.dataset.number === text) return;
        const firstRender = !node.dataset.number;
        node.dataset.number = text;
        node.setAttribute("aria-label", text);
        if (firstRender) {
          node.textContent = "";
          for (const char of text) {
            const win = document.createElement("span");
            win.className = "digit-window";
            win.dataset.digit = char;
            win.appendChild(newGlyph(char));
            node.appendChild(win);
          }
          return;
        }
        [...node.children].forEach(function(win, i) {
          const nextChar = text[i];
          if (win.dataset.digit === nextChar) return;
          win.dataset.digit = nextChar;
          const prevChar = win.querySelector(".digit-face")?.textContent || "0";
          const outgoing = newGlyph(prevChar);
          const incoming = newGlyph(nextChar);
          win.replaceChildren(outgoing, incoming);
          if (reduceMotion.matches || !incoming.animate) {
            win.replaceChildren(incoming);
            return;
          }
          const options = { duration: 490, easing: "cubic-bezier(.19,.75,.2,1)", fill: "forwards" };
          outgoing.animate([
            { transform: "translate3d(0,0,0)", opacity: 1, filter: "blur(0px)" },
            { transform: "translate3d(0,44%,0)", opacity: 0, filter: "blur(.9px)" }
          ], options);
          const animation = incoming.animate([
            { transform: "translate3d(0,-47%,0)", opacity: 0, filter: "blur(.9px)" },
            { transform: "translate3d(0,0,0)", opacity: 1, filter: "blur(0px)" }
          ], options);
          animation.finished.then(function() {
            if (win.dataset.digit === nextChar && incoming.parentNode === win) {
              win.replaceChildren(incoming);
            }
          }).catch(function(){ /* Newer digit superseded this animation. */ });
        });
      }

      // Each circle tracks its own unit. Thresholds apply to the REAL remaining
      // fraction, not to a decorative display percentage.
      const unitMax = [12, 4, 7, 24, 60, 60];
      function updateDial(node, number, index) {
        const fraction = Math.max(0, Math.min(1, number / unitMax[index]));
        const dial = node.closest(".dial");
        // Leave a small illuminated marker at zero so red remains visible.
        const displayFraction = Math.max(0.045, fraction);
        dial.style.setProperty("--progress", (displayFraction * 100).toFixed(3) + "%");
        dial.classList.toggle("danger", fraction <= 0.10);
        dial.classList.toggle("warn", fraction > 0.10 && fraction <= 0.20);
      }

      function update() {
        const now = Date.now();
        const remaining = Math.max(0, TARGET - now);
        const numbers = breakdown(Math.floor(now / 1000) * 1000);
        ids.forEach(function(id, i) {
          setNumber(nodes[id], numbers[i]);
          updateDial(nodes[id], numbers[i], i);
        });

        if (now >= TARGET && !completed) {
          completed = true;
          screenreader.textContent = "The countdown has finished. It's March 4, 2027 in Baghdad.";
        } else if (remaining > 0) {
          const minute = Math.floor(now / 60000);
          if (minute !== lastAnnouncement) {
            lastAnnouncement = minute;
            screenreader.textContent = numbers[0] + " months, " + numbers[1] + " weeks, " +
              numbers[2] + " days, " + numbers[3] + " hours, " + numbers[4] +
              " minutes until March 4, 2027.";
          }
        }
        // Re-align to the real clock every tick: no drift after tab suspension.
        if (remaining > 0) {
          const wait = Math.max(80, 1000 - (Date.now() % 1000) + 18);
          setTimeout(update, wait);
        }
      }
      update();
      // If a sleeping browser tab resumes, refresh immediately.
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && !completed) update();
      });
    })();
  </script>
</body>
</html>
