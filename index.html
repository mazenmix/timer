<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#040a0e">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MX Timer">
  <meta name="description" content="A beautiful live countdown to March 4, 2027 — the journey to Manila.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="MX Timer">
  <meta property="og:description" content="Counting down every second to March 4, 2027.">
  <title>MX Timer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
  <link rel="manifest" href="site.webmanifest?v=3">
  <style>
:root{color-scheme:dark;--glow:#62ffc6;--mint:#a6ffe3;--ink:#f7fffd;--muted:#a3c5bd}
*{box-sizing:border-box}
html{min-width:320px;min-height:100%;background:#040a0e}
body{margin:0;min-height:100vh;min-height:100svh;background:#040a0e;color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;overflow-x:hidden}
.screen{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,36px)}
.timer-shell{position:relative;width:min(1270px,100%);padding:clamp(25px,3.5vw,44px) clamp(16px,2.9vw,37px);background:linear-gradient(160deg,#0c1b1e 0%,#061012 53%,#0a1719 100%);border:1px solid rgba(107,255,198,.22);border-radius:29px;box-shadow:inset 0 1px 0 rgba(230,255,243,.07),inset 0 -1px 0 rgba(109,255,194,.055),0 20px 72px rgba(0,0,0,.52),0 0 32px rgba(32,255,163,.08)}
.timer-shell::before,.timer-shell::after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:110px;height:2px;border-radius:10px;background:linear-gradient(90deg,transparent,#8bffe0,transparent);box-shadow:0 0 12px rgba(59,255,176,.52);pointer-events:none}
.timer-shell::before{top:0}.timer-shell::after{bottom:0}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:center;gap:clamp(8px,1.2vw,16px)}
.unit{position:relative;display:flex;min-width:0;align-items:center;justify-content:center;flex-direction:column;gap:clamp(11px,1.35vw,19px);min-height:195px;padding:15px 4px 12px;border-radius:20px;background:linear-gradient(180deg,rgba(25,56,52,.18),rgba(6,14,17,.12))}
.unit:not(:last-child)::after{content:"";position:absolute;right:calc(clamp(8px,1.2vw,16px)/-2);top:32%;width:1px;height:35%;background:linear-gradient(transparent,rgba(78,255,189,.28),transparent);box-shadow:0 0 11px rgba(28,255,163,.22)}
.dial{--p:34%;position:relative;isolation:isolate;flex-shrink:0;display:grid;place-items:center;width:min(100%,157px);aspect-ratio:1;border-radius:50%;background:conic-gradient(from -90deg,#d6fff2 0%,#a9ffe2 3%,#54ffd0 10%,#17fba2 var(--p),#12312c var(--p),#14302c 100%);box-shadow:0 0 1px rgba(180,255,222,.7),0 0 18px rgba(28,255,160,.27),0 0 38px rgba(31,255,163,.115),inset 0 0 2px rgba(240,255,246,.44);transition:box-shadow .25s ease}
.dial::before{content:"";position:absolute;inset:7px;z-index:0;border-radius:50%;background:radial-gradient(ellipse at 45% 15%,rgba(122,250,209,.14) 0%,transparent 36%),radial-gradient(circle at 50% 48%,#102427 0%,#091719 58%,#071113 100%);box-shadow:inset 0 0 0 1px rgba(124,250,199,.11),inset 0 0 24px rgba(0,0,0,.48)}
.dial::after{content:"";z-index:2;position:absolute;inset:2px;border-radius:50%;background:linear-gradient(165deg,rgba(230,255,250,.23) 0%,rgba(236,255,247,.10) 17%,transparent 31%,transparent 72%,rgba(111,255,205,.05) 95%),radial-gradient(ellipse at 29% 18%,rgba(255,255,255,.2),transparent 25%);pointer-events:none;mix-blend-mode:screen}
.shine{position:absolute;z-index:2;pointer-events:none;left:17%;top:8%;width:50%;height:17%;border-radius:50%;transform:rotate(-21deg);background:linear-gradient(180deg,rgba(225,255,245,.17),rgba(225,255,245,0));filter:blur(5px)}
.value{position:relative;z-index:3;font-size:clamp(36px,4.4vw,64px);line-height:1;font-weight:760;letter-spacing:-.05em;white-space:nowrap;font-variant-numeric:tabular-nums lining-nums;color:#f7fffd;text-shadow:0 0 10px rgba(255,255,255,.11),0 0 20px rgba(118,255,216,.13)}
.value.tick{animation:tick .23s ease-out}
@keyframes tick{from{opacity:.62;transform:translateY(3px) scale(.985)}to{opacity:1;transform:none}}
.label{color:var(--muted);font-size:clamp(9px,.9vw,12px);font-weight:750;line-height:1.3;letter-spacing:.14em;text-align:center;white-space:nowrap;text-transform:uppercase;user-select:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:1080px){.timer-shell{padding:25px 17px}.unit{min-height:160px;gap:12px}.dial{width:min(100%,125px)}.value{font-size:clamp(34px,4vw,53px)}}
@media(max-width:830px){.timer-shell{max-width:560px;padding:25px 16px;border-radius:23px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.unit{min-height:0;aspect-ratio:1/1.16;padding:12px 4px;gap:12px}.unit:not(:last-child)::after{display:none}.dial{width:min(90%,140px)}.value{font-size:clamp(36px,7vw,55px)}.label{font-size:clamp(9px,1.8vw,11px)}}
@media(max-width:480px){.screen{padding:12px}.timer-shell{padding:21px 10px}.grid{gap:7px}.unit{border-radius:14px;gap:10px;padding:10px 2px}.dial{width:min(92%,112px)}.dial::before{inset:6px}.value{font-size:clamp(30px,8.5vw,45px)}.label{font-size:clamp(8px,2.4vw,10px);letter-spacing:.07em}}
@media(max-width:350px){.screen{padding:8px}.timer-shell{padding:20px 7px}.grid{gap:5px}.value{font-size:30px}.label{font-size:8px;letter-spacing:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="screen">
  <main class="timer-shell" aria-label="Live countdown to March 4, 2027">
    <section class="grid" id="timer" role="timer" aria-live="off"><div class="unit"><div class="dial"><span class="shine" aria-hidden="true"></span><span id="months" class="value">--</span></div><span class="label">MONTHS</span></div>
<div class="unit"><div class="dial"><span class="shine" aria-hidden="true"></span><span id="weeks" class="value">--</span></div><span class="label">WEEKS</span></div>
<div class="unit"><div class="dial"><span class="shine" aria-hidden="true"></span><span id="days" class="value">--</span></div><span class="label">DAYS</span></div>
<div class="unit"><div class="dial"><span class="shine" aria-hidden="true"></span><span id="hours" class="value">--</span></div><span class="label">HOURS</span></div>
<div class="unit"><div class="dial"><span class="shine" aria-hidden="true"></span><span id="minutes" class="value">--</span></div><span class="label">MINUTES</span></div>
<div class="unit"><div class="dial"><span class="shine" aria-hidden="true"></span><span id="seconds" class="value">--</span></div><span class="label">SECONDS</span></div></section>
  </main>
</div>
<div class="sr-only" id="screenreader" aria-live="polite" aria-atomic="true"></div>
<script>
    (function () {
      "use strict";
      // March 4, 2027 at 00:00 Baghdad time (Asia/Baghdad, UTC+03).
      // An explicit UTC instant means all devices count down to the SAME moment.
      const TARGET = Date.parse("2027-03-03T21:00:00Z");
      const BAGHDAD_OFFSET_MS = 3 * 60 * 60 * 1000;
      const formatter = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Baghdad", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
      });
      const ids = ["months", "weeks", "days", "hours", "minutes", "seconds"];
      const nodes = Object.fromEntries(ids.map(function(id) { return [id, document.getElementById(id)]; }));
      const screenreader = document.getElementById("screenreader");
      let lastAnnouncement = -1;
      let completed = false;

      function partsAt(instant) {
        const parts = {};
        formatter.formatToParts(new Date(instant)).forEach(function(part) {
          if (part.type !== "literal") parts[part.type] = Number(part.value);
        });
        return parts;
      }

      function plusMonths(original, count) {
        const index = original.year * 12 + original.month - 1 + count;
        const year = Math.floor(index / 12);
        const month = index - year * 12 + 1;
        const maxDay = new Date(Date.UTC(year, month, 0)).getUTCDate();
        return {
          year: year, month: month, day: Math.min(original.day, maxDay),
          hour: original.hour, minute: original.minute, second: original.second
        };
      }

      function baghdadInstant(parts) {
        return Date.UTC(parts.year, parts.month - 1, parts.day,
          parts.hour, parts.minute, parts.second) - BAGHDAD_OFFSET_MS;
      }

      function breakdown(now) {
        if (now >= TARGET) return [0, 0, 0, 0, 0, 0];
        const localNow = partsAt(now);
        let months = Math.max(0, (2027 - localNow.year) * 12 + (3 - localNow.month));
        while (months > 0 && baghdadInstant(plusMonths(localNow, months)) > TARGET) months--;
        while (baghdadInstant(plusMonths(localNow, months + 1)) <= TARGET) months++;
        let remainingSeconds = Math.floor((TARGET - baghdadInstant(plusMonths(localNow, months))) / 1000);
        const weeks = Math.floor(remainingSeconds / 604800); remainingSeconds %= 604800;
        const days = Math.floor(remainingSeconds / 86400); remainingSeconds %= 86400;
        const hours = Math.floor(remainingSeconds / 3600); remainingSeconds %= 3600;
        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = remainingSeconds % 60;
        return [months, weeks, days, hours, minutes, seconds];
      }

      function setNumber(node, number) {
        const value = String(number).padStart(2, "0");
        if (node.textContent === value) return;
        node.textContent = value;
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          node.classList.remove("tick");
          void node.offsetWidth;
          node.classList.add("tick");
        }
      }

      function update() {
        const now = Date.now();
        const remaining = Math.max(0, TARGET - now);
        const numbers = breakdown(Math.floor(now / 1000) * 1000);
        ids.forEach(function(id, i) {
          setNumber(nodes[id], numbers[i]);
          const max = [12, 4, 7, 24, 60, 60][i];
          const fraction = ((numbers[i] % max) / max);
          const percent = Math.round(20 + (1 - fraction) * 72);
          nodes[id].parentElement.style.setProperty("--p", percent + "%");
        });

        if (now >= TARGET && !completed) {
          completed = true;
          screenreader.textContent = "The countdown has finished. It's March 4, 2027 in Baghdad.";
        } else if (remaining > 0) {
          const minute = Math.floor(now / 60000);
          if (minute !== lastAnnouncement) {
            lastAnnouncement = minute;
            screenreader.textContent = numbers[0] + " months, " + numbers[1] + " weeks, " +
              numbers[2] + " days, " + numbers[3] + " hours, " + numbers[4] +
              " minutes until March 4, 2027.";
          }
        }
        // Re-align to the real clock every tick: no drift after tab suspension.
        if (remaining > 0) {
          const wait = Math.max(80, 1000 - (Date.now() % 1000) + 18);
          setTimeout(update, wait);
        }
      }
      update();
      // If a sleeping browser tab resumes, refresh immediately.
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && !completed) update();
      });
    })();
  </script>
</body>
</html>
