<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#040a0e">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MX Timer">
  <meta name="description" content="A beautiful live countdown to March 4, 2027 — the journey to Manila.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="MX Timer">
  <meta property="og:description" content="Counting down every second to March 4, 2027.">
  <title>MX Timer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
  <link rel="manifest" href="site.webmanifest?v=3">
  <style>
:root{color-scheme:dark;--green:#68ffd0;--green-bright:#16ffa3;--track:#14302c;--text:#f5fbfa}
*{box-sizing:border-box}
html{min-width:320px;min-height:100%;background:#040a0e}
body{margin:0;min-height:100vh;min-height:100svh;overflow-x:hidden;background:#040a0e;color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
.screen{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,38px)}
.timer-shell{position:relative;width:min(1270px,100%);padding:clamp(23px,3.25vw,44px) clamp(15px,2.7vw,36px);border:1px solid rgba(94,255,192,.27);border-radius:29px;background:linear-gradient(155deg,#0a161a,#061013 58%,#0a181b);box-shadow:inset 0 1px 0 rgba(190,255,226,.08),0 21px 70px rgba(0,0,0,.52),0 0 39px rgba(20,255,160,.075)}
.timer-shell::before,.timer-shell::after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:clamp(65px,10vw,118px);height:2px;border-radius:20px;background:linear-gradient(90deg,transparent,#64ffc6,transparent);box-shadow:0 0 16px rgba(61,255,166,.68);pointer-events:none}
.timer-shell::before{top:0}.timer-shell::after{bottom:0}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(7px,1.1vw,16px);align-items:center}
.unit{position:relative;min-width:0;aspect-ratio:1;display:flex;justify-content:center;align-items:center;border-radius:19px;background:linear-gradient(180deg,rgba(31,65,59,.11),rgba(0,0,0,.06))}
.unit:not(:last-child)::after{content:"";position:absolute;top:35%;right:calc(-.5 * clamp(7px,1.1vw,16px) - 1px);height:30%;width:1px;background:linear-gradient(transparent,rgba(95,255,186,.45),transparent);box-shadow:0 0 10px rgba(58,255,168,.18)}
.dial{--p:30%;position:relative;isolation:isolate;display:grid;place-items:center;width:min(100%,160px);aspect-ratio:1;border-radius:50%;background:conic-gradient(from -78deg,#a5ffdf 0%,#30ffaf 5%,#26ffad var(--p),#15352d var(--p),#15352d 100%);box-shadow:0 0 1px 1px rgba(105,255,188,.48),0 0 13px rgba(49,255,167,.31),0 0 30px rgba(14,255,158,.19),0 0 53px rgba(18,240,155,.075);transition:box-shadow .25s}
.dial::before{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 50% 36%,#142829 0%,#09191b 48%,#071114 100%);box-shadow:inset 0 0 0 1px rgba(117,255,198,.13),inset 0 0 24px rgba(0,0,0,.6)}
.dial::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(99,255,181,.14);box-shadow:inset 0 0 8px rgba(46,255,178,.08);pointer-events:none}
.unit:last-child .dial{box-shadow:0 0 2px rgba(149,255,215,.72),0 0 18px rgba(38,255,176,.42),0 0 40px rgba(29,255,159,.25),0 0 62px rgba(19,255,159,.09)}
.value{position:relative;z-index:1;color:#f8fffd;font-size:clamp(36px,4.5vw,64px);line-height:1;font-weight:750;letter-spacing:-.055em;white-space:nowrap;font-variant-numeric:tabular-nums lining-nums;text-shadow:0 0 8px rgba(255,255,255,.09),0 0 27px rgba(109,255,207,.13)}
.value.tick{animation:digit .23s ease-out}
@keyframes digit{from{opacity:.64;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:1050px){.timer-shell{padding:26px 19px}.dial{width:min(100%,133px)}.value{font-size:clamp(34px,4.4vw,56px)}}
@media(max-width:830px){.timer-shell{max-width:560px;padding:28px 19px;border-radius:23px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.unit{aspect-ratio:1}.unit:not(:last-child)::after{display:none}.dial{width:min(90%,151px)}.value{font-size:clamp(39px,6.7vw,58px)}}
@media(max-width:480px){.screen{padding:12px}.timer-shell{padding:23px 12px}.grid{gap:9px}.unit{border-radius:13px}.dial{width:min(90%,120px)}.dial::before{inset:6px}.value{font-size:clamp(31px,9vw,46px)}}
@media(max-width:350px){.timer-shell{padding:22px 10px}.grid{gap:6px}.value{font-size:31px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="screen">
  <main class="timer-shell" aria-label="Live countdown to March 4, 2027">
    <section class="grid" id="timer" role="timer" aria-live="off"><div class="unit"><div class="dial"><span id="months" class="value">--</span></div><span class="sr-only">MONTHS</span></div>
<div class="unit"><div class="dial"><span id="weeks" class="value">--</span></div><span class="sr-only">WEEKS</span></div>
<div class="unit"><div class="dial"><span id="days" class="value">--</span></div><span class="sr-only">DAYS</span></div>
<div class="unit"><div class="dial"><span id="hours" class="value">--</span></div><span class="sr-only">HOURS</span></div>
<div class="unit"><div class="dial"><span id="minutes" class="value">--</span></div><span class="sr-only">MINUTES</span></div>
<div class="unit"><div class="dial"><span id="seconds" class="value">--</span></div><span class="sr-only">SECONDS</span></div></section>
  </main>
</div>
<div class="sr-only" id="screenreader" aria-live="polite" aria-atomic="true"></div>
<script>
    (function () {
      "use strict";
      // March 4, 2027 at 00:00 Baghdad time (Asia/Baghdad, UTC+03).
      // An explicit UTC instant means all devices count down to the SAME moment.
      const TARGET = Date.parse("2027-03-03T21:00:00Z");
      const BAGHDAD_OFFSET_MS = 3 * 60 * 60 * 1000;
      const formatter = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Baghdad", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
      });
      const ids = ["months", "weeks", "days", "hours", "minutes", "seconds"];
      const nodes = Object.fromEntries(ids.map(function(id) { return [id, document.getElementById(id)]; }));
      const screenreader = document.getElementById("screenreader");
      let lastAnnouncement = -1;
      let completed = false;

      function partsAt(instant) {
        const parts = {};
        formatter.formatToParts(new Date(instant)).forEach(function(part) {
          if (part.type !== "literal") parts[part.type] = Number(part.value);
        });
        return parts;
      }

      function plusMonths(original, count) {
        const index = original.year * 12 + original.month - 1 + count;
        const year = Math.floor(index / 12);
        const month = index - year * 12 + 1;
        const maxDay = new Date(Date.UTC(year, month, 0)).getUTCDate();
        return {
          year: year, month: month, day: Math.min(original.day, maxDay),
          hour: original.hour, minute: original.minute, second: original.second
        };
      }

      function baghdadInstant(parts) {
        return Date.UTC(parts.year, parts.month - 1, parts.day,
          parts.hour, parts.minute, parts.second) - BAGHDAD_OFFSET_MS;
      }

      function breakdown(now) {
        if (now >= TARGET) return [0, 0, 0, 0, 0, 0];
        const localNow = partsAt(now);
        let months = Math.max(0, (2027 - localNow.year) * 12 + (3 - localNow.month));
        while (months > 0 && baghdadInstant(plusMonths(localNow, months)) > TARGET) months--;
        while (baghdadInstant(plusMonths(localNow, months + 1)) <= TARGET) months++;
        let remainingSeconds = Math.floor((TARGET - baghdadInstant(plusMonths(localNow, months))) / 1000);
        const weeks = Math.floor(remainingSeconds / 604800); remainingSeconds %= 604800;
        const days = Math.floor(remainingSeconds / 86400); remainingSeconds %= 86400;
        const hours = Math.floor(remainingSeconds / 3600); remainingSeconds %= 3600;
        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = remainingSeconds % 60;
        return [months, weeks, days, hours, minutes, seconds];
      }

      function setNumber(node, number) {
        const value = String(number).padStart(2, "0");
        if (node.textContent === value) return;
        node.textContent = value;
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          node.classList.remove("tick");
          void node.offsetWidth;
          node.classList.add("tick");
        }
      }

      function update() {
        const now = Date.now();
        const remaining = Math.max(0, TARGET - now);
        const numbers = breakdown(Math.floor(now / 1000) * 1000);
        ids.forEach(function(id, i) {
          setNumber(nodes[id], numbers[i]);
          const max = [12, 4, 7, 24, 60, 60][i];
          const fraction = ((numbers[i] % max) / max);
          const percent = Math.round(20 + (1 - fraction) * 72);
          nodes[id].parentElement.style.setProperty("--p", percent + "%");
        });

        if (now >= TARGET && !completed) {
          completed = true;
          screenreader.textContent = "The countdown has finished. It's March 4, 2027 in Baghdad.";
        } else if (remaining > 0) {
          const minute = Math.floor(now / 60000);
          if (minute !== lastAnnouncement) {
            lastAnnouncement = minute;
            screenreader.textContent = numbers[0] + " months, " + numbers[1] + " weeks, " +
              numbers[2] + " days, " + numbers[3] + " hours, " + numbers[4] +
              " minutes until March 4, 2027.";
          }
        }
        // Re-align to the real clock every tick: no drift after tab suspension.
        if (remaining > 0) {
          const wait = Math.max(80, 1000 - (Date.now() % 1000) + 18);
          setTimeout(update, wait);
        }
      }
      update();
      // If a sleeping browser tab resumes, refresh immediately.
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && !completed) update();
      });
    })();
  </script>
</body>
</html>
